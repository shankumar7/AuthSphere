name: AuthSphere CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint-and-typecheck:
    name: Backend Code Quality & Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff mypy pytest pytest-asyncio
          if [ -f backend/pyproject.toml ]; then pip install -e ./backend; fi

      - name: Run Ruff Linter
        run: |
          ruff check backend/

      - name: Run Mypy Strict Type Checker
        run: |
          mypy --strict backend/app

  unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio cryptography sqlalchemy structlog pydantic pydantic-settings
          if [ -f backend/pyproject.toml ]; then pip install -e ./backend; fi

      - name: Run Pytest Unit Tests
        run: |
          pytest backend/tests/unit
